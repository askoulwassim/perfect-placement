version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /runtimes/browser
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node types track the oldest supported Node (engines >=22); newer majors type APIs Node 22 lacks.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

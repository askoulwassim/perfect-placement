name: Bug report
description: Something in pp doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please leave out personal data (names, emails, resumes, role details from your own search).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ideally on demo data (`pp up --fixtures`).
      placeholder: |
        1. pp up --fixtures
        2. Open River
        3. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: pp doctor output
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Node version, agent
      placeholder: macOS 15.6, Node 22.22.2, Claude Code
    validations:
      required: true

name: Feature request
description: An idea for pp.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What's hard or missing in your job search today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered

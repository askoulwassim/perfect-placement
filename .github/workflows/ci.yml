name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint
  browser-regression:
    # The PP browser adapter against the real, patched chrome-devtools-mcp and headless Chrome (#161): uploads only
    # to file inputs, no Submit click, no Enter from a typed answer, only the run's page and sites. The runtime is
    # installed the way users get it (pp setup), so a Dependabot bump whose upload patch no longer applies fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm build
      - name: pp setup installs the pinned browser runtime into a temporary cache
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/pp-browser-cache
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
          OPENUI_TELEMETRY_DISABLED: '1'
        # Cursor uses the same pinned adapter; Codex setup deliberately reports the Gmail isolation blocker (#158).
        run: node packages/cli/dist/index.js setup --home "$RUNNER_TEMP/pp-vault" --runner cursor-agent --yes --no-kev --no-mcp --no-schedules
      - name: Let headless Chrome use its sandbox (Ubuntu 24.04 restricts unprivileged user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Real-browser regression
        env:
          PP_BROWSER_TEST_CACHE: ${{ runner.temp }}/pp-browser-cache
          OPENUI_TELEMETRY_DISABLED: '1'
        run: pnpm --filter @perfect-placement/mcp exec vitest run src/browser.integration.test.ts
  fresh-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: shellcheck
        run: shellcheck -s sh install.sh uninstall.sh scripts/fresh-install-smoke.sh
      - name: install.sh --check
        run: ./install.sh --check
      - name: install.sh (corepack pnpm, launchers in ~/.local/bin)
        run: ./install.sh
      - name: setup, up, write, restart, read back
        env:
          OPENUI_TELEMETRY_DISABLED: '1'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          PP_HOME="$RUNNER_TEMP/pp-vault" PP=pp scripts/fresh-install-smoke.sh
      - name: uninstall.sh (plan, setup reset, purge with backup, rerun)
        run: |
          export PP_HOME="$RUNNER_TEMP/pp-vault"
          ./uninstall.sh --dry-run --purge
          ./uninstall.sh --yes
          test -f "$PP_HOME/pp.db" && test ! -e "$HOME/.local/bin/pp"
          ./uninstall.sh --purge --yes
          test ! -e "$PP_HOME" && tar -tzf "$HOME"/perfect-placement-backups/vault-*.tar.gz | grep -q 'pp-vault/pp.db'
          ./uninstall.sh --purge --yes | grep -q 'nothing to remove'
